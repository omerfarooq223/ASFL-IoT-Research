[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asfl-iot"
version = "1.0.0"
description = "ASFL-IoT: Risk-Coupled Adaptive Secure Federated Learning for Trust-Aware Internet-of-Things Systems (IEEE ICES&T 2026)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Saliha Zulfiqar"},
    {name = "Muhammad Umar Farooq", email = "momerfarooq223@gmail.com"},
    {name = "Muhammad Zunnurain Hussain"},
    {name = "Muhammad Zulkifl Hasan"}
]
keywords = [
    "federated-learning",
    "internet-of-things",
    "byzantine-robustness",
    "differential-privacy",
    "trust-management",
    "asynchronous-fl",
    "non-iid"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
]

[project.urls]
"Paper" = "https://ieeexplore.ieee.org"
"Source" = "https://github.com/omerfarooq223/ASFL-IoT-Research"

[tool.setuptools.packages.find]
where = ["."]
include = ["asfl_iot*"]
